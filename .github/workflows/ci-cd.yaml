
name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'code/todo-service/**'
      - 'code/auth-service/**'
      - 'code/api-gateway/**'
      - 'code/client/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - todo-service
          - auth-service
          - api-gateway
          - client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: code/${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: code/${{ matrix.service }}
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ] || echo "$TEST_SCRIPT" | grep -q "no test specified"; then
          echo "No tests configured for ${{ matrix.service }}. Skipping."
          else
           npm test
           fi

      - name: Build project
        working-directory: code/${{ matrix.service }}
        run: npm run build --if-present
