
name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'code/todo-service/**'
      - 'code/auth-service/**'
      - 'code/api-gateway/**'
      - 'code/client/**'
      - 'infra-gitops/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
# Gitleaks scan for secrets
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
            
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

# Checkov scans for Terraform, Kubernetes, and Dockerfile
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Terraform scan
        run: |
          checkov -d infra-gitops/ \
            --framework terraform \
            --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Kubernetes scan
        run: |
          checkov -d k8s/ \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true
      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

# trivy scan for all services 
  trivy-scan:
    name: Trivy FS Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    strategy:
      fail-fast: false
      matrix:
        service:
          - todo-service
          - auth-service
          - api-gateway
          - client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy

      - name: Run Trivy FS scan (JSON)
        run: |
          trivy fs "code/${{ matrix.service }}" \
            --format json \
            --output "${{ matrix.service }}-trivy-fs-report.json" \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy FS scan (TABLE)
        run: |
          trivy fs "code/${{ matrix.service }}" \
            --format table \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            > "${{ matrix.service }}-trivy-fs-report.txt"

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-trivy-fs-json-report
          path: ${{ matrix.service }}-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-trivy-fs-table-report
          path: ${{ matrix.service }}-trivy-fs-report.txt
          if-no-files-found: warn

# Linting for all services
  lint:
    name: Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform

    strategy:
      fail-fast: false
      matrix:
        service:
          - todo-service
          - auth-service
          - api-gateway
          - client

    defaults:
      run:
        working-directory: code/${{ matrix.service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

  # Client Test
  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: code/client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run client tests
        run: npm test --if-present

  # Backend Service Tests
  server-test:
    name: Server Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        service:
          - todo-service
          - auth-service
          - api-gateway

    defaults:
      run:
        working-directory: code/${{ matrix.service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/${{ matrix.service }}/package-lock.json

      - name: Install server dependencies
        run: npm ci

     
      - name: Run server tests
        run: |
         if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
         if grep -q 'no test specified' package.json; then
         echo "No tests configured yet. Skipping tests."
         else
         npm test
         fi
         else
         echo "No test script found. Skipping tests."
         fi



  sonarqube:
    name: SonarQube Analysis - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - client-test
      - server-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - todo-service
          - auth-service
          - api-gateway
          - client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: code/${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Display Quality Gate Status
        if: always()
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Quality Gate status: ${{ steps.quality-gate.outputs.quality-gate-status }}"
