
name: CI/CD - Api Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'code/api-gateway/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d code/api-gateway \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy FS Scan - client
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.68.2 fs \
            --format json \
            --output /work/api-gateway-trivy-fs-report.json \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /work/code/api-gateway

      - name: Run Trivy FS scan (TABLE)
        run: |
          docker run --rm \
  
  update-main-manifest:
    name: Update Main Branch API Gateway Manifest
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TOKEN_GITHUB_PAT }}

      - name: Update API Gateway image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          MANIFEST="k8-manifests/api-gateway.yaml"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          grep -q 'image: sanketmahajan/micro-service-mernapp:' "$MANIFEST" || {
            echo "API Gateway image not found in $MANIFEST"
            exit 1
          }

          sed -i \
            "s|image: sanketmahajan/micro-service-mernapp:.*|image: sanketmahajan/micro-service-mernapp:${IMAGE_TAG}|" \
            "$MANIFEST"

          echo "Updated API Gateway image:"
          grep "image:" "$MANIFEST"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8-manifests/api-gateway.yaml

          git commit -m "Update API Gateway image to ${GITHUB_SHA} [skip ci]" \
            || echo "No manifest changes to commit"

          git push origin main

  deploy-to-k8s:
    name: Deploy API Gateway to Amazon EKS
    runs-on: ubuntu-latest
    needs: update-main-manifest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: todo-microservice-dev-eks
      K8S_NAMESPACE: todo-app

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TOKEN_GITHUB_PAT }}

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932542905800:role/todo-microservice-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify namespace and access
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"
          kubectl auth can-i get deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i patch deployments -n "${K8S_NAMESPACE}"

      - name: Apply API Gateway manifest
        run: |
          kubectl apply \
            -f k8-manifests/api-gateway.yaml \
            -n "${K8S_NAMESPACE}"

      - name: Verify API Gateway rollout
        run: |
          kubectl rollout status deployment/api-gateway \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s

      - name: Verify API Gateway resources
        if: success()
        run: |
          kubectl get deployment api-gateway -n "${K8S_NAMESPACE}"
          kubectl get pods -l app=api-gateway -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"
