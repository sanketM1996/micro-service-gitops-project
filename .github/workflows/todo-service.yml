
name: CI/CD - Todo Service

on:
  push:
    branches:
      - main
    paths:
      - 'code/todo-service/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d code/todo-service \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy FS Scan - todo-service
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.68.2 fs \
            --format json \
            --output /work/todo-service-trivy-fs-report.json \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /work/code/todo-service

      - name: Run Trivy FS scan (TABLE)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.68.2 fs \
            --format table \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /work/code/todo-service \
            > todo-service-trivy-fs-report.txt

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-trivy-fs-json-report
          path: todo-service-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-trivy-fs-table-report
          path: todo-service-trivy-fs-report.txt
          if-no-files-found: warn

  lint:
    name: Lint - todo-service
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - checkov-dockerfile
    defaults:
      run:
        working-directory: code/todo-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/todo-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

  todo-service-test:
    name: Todo Service Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: code/todo-service
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/todo-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            if grep -q 'no test specified' package.json; then
              echo "No tests configured yet. Skipping tests."
            else
              npm test
            fi
          else
            echo "No test script found. Skipping tests."
          fi

  sonarqube:
    name: SonarQube Analysis - todo-service
    runs-on: ubuntu-latest
    needs: todo-service-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: code/todo-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        id: quality-gate
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: code/todo-service/.scannerwork/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Display Quality Gate Status
        if: always()
        run: |
          echo "Service: todo-service"
          echo "Quality Gate status: ${{ steps.quality-gate.outputs.quality-gate-status }}"

  docker:
    name: Build, Scan, SBOM and Push - todo-service
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Todo Service Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./code/todo-service
          file: ./code/todo-service/Dockerfile
          push: false
          load: true
          tags: sanketmahajan/micro-service-mernapp:todo-service

      - name: Save Todo Service image archive
        run: |
          docker save \
            sanketmahajan/micro-service-mernapp:todo-service \
            -o todo-service-image.tar

      - name: Run Trivy image scan (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan" \
            aquasec/trivy:0.68.2 image \
            --input /scan/todo-service-image.tar \
            --format json \
            --output /scan/todo-service-image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy image scan (TABLE)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan" \
            aquasec/trivy:0.68.2 image \
            --input /scan/todo-service-image.tar \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            > todo-service-image-trivy-report.txt

      - name: Upload Trivy image JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-image-trivy-json-report
          path: todo-service-image-trivy-report.json
          if-no-files-found: warn

      - name: Upload Trivy image table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-image-trivy-table-report
          path: todo-service-image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate Todo Service source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./code/todo-service
          format: spdx-json
          output-file: todo-service-source-sbom.spdx.json
          upload-artifact: true

      - name: Generate Todo Service image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sanketmahajan/micro-service-mernapp:todo-service
          format: spdx-json
          output-file: todo-service-image-sbom.spdx.json
          upload-artifact: true

      - name: Upload SBOM files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-sbom-reports
          path: |
            todo-service-source-sbom.spdx.json
            todo-service-image-sbom.spdx.json
          if-no-files-found: warn

      - name: Push Todo Service image to Docker Hub
        run: |
          docker push sanketmahajan/micro-service-mernapp:todo-service
