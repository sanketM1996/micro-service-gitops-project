name: CI/CD - Client

on:
  push:
    branches:
      - main
    paths:
      - 'code/client/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d code/client --framework dockerfile --output json > checkov-dockerfile-report.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy FS Scan - client
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true
      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy
      - name: Run Trivy FS scan (JSON)
        run: |
          trivy fs "code/client" \
            --format json \
            --output "client-trivy-fs-report.json" \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
      - name: Run Trivy FS scan (TABLE)
        run: |
          trivy fs "code/client" \
            --format table \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            > "client-trivy-fs-report.txt"
      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-json-report
          path: client-trivy-fs-report.json
          if-no-files-found: warn
      - name: Upload Trivy table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-table-report
          path: client-trivy-fs-report.txt
          if-no-files-found: warn

  lint:
    name: Lint - client
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - checkov-dockerfile
    defaults:
      run:
        working-directory: code/client
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: code/client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            if grep -q 'no test specified' package.json; then
              echo "No tests configured yet. Skipping tests."
            else
              npm test
            fi
          else
            echo "No test script found. Skipping tests."
          fi

  sonarqube:
    name: SonarQube Analysis - client
    runs-on: ubuntu-latest
    needs: client-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: code/client
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate Check
        id: quality-gate
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: code/client/.scannerwork/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Display Quality Gate Status
        if: always()
        run: |
          echo "Service: client"
          echo "Quality Gate status: ${{ steps.quality-gate.outputs.quality-gate-status }}"

 
  #* =================================*
  #* Stage: Build React application
  #* =================================*
  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    needs: client-test

    defaults:
      run:
        working-directory: code/client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

  #* =================================*
  #* Stage: Docker Build, Scan and Push
  #* =================================*
  docker:
    name: Client Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: client-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      #* Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #* Configure Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      #* =================================*
      #* Stage: Build Client Docker Image
      #* =================================*
      - name: Build client Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./code/client
          file: ./code/client/Dockerfile
          load: true
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: sanketmahajan/micro-service-mernapp:client

      #* =================================*
      #* Stage: Trivy Image Security Scan
      #* =================================*
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.68.2
          cache: true

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy

      #* Generate JSON report
      - name: Run Trivy image scan (JSON)
        run: |
          trivy image sanketmahajan/micro-service-mernapp:client \
            --format json \
            --output image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      #* Generate TABLE report
      - name: Run Trivy image scan (TABLE)
        run: |
          trivy image sanketmahajan/micro-service-mernapp:client \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > image-trivy-report.txt

      #* Upload JSON report
      - name: Upload Trivy image JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-image-trivy-json-report
          path: image-trivy-report.json
          if-no-files-found: warn

      #* Upload TABLE report
      - name: Upload Trivy image TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-image-trivy-table-report
          path: image-trivy-report.txt
          if-no-files-found: warn

      #* =================================*
      #* Stage: Generate Software Bill of Materials
      #* =================================*

      #* Generate source SBOM
      - name: Generate client source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./code/client
          format: spdx-json
          output-file: client-source-sbom.spdx.json
          upload-artifact: true

      #* Generate image SBOM
      - name: Generate client image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sanketmahajan/micro-service-mernapp:client
          format: spdx-json
          output-file: client-image-sbom.spdx.json
          upload-artifact: true

      #* =================================*
      #* Stage: Push Docker Image
      #* =================================*
      - name: Push client Docker image
        run: docker push sanketmahajan/micro-service-mernapp:client
