
name: CI/CD - Client

on:
  push:
    branches:
      - main
    paths:
      - 'code/client/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d code/client \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy FS Scan - client
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.68.2 fs \
            --format json \
            --output /work/client-trivy-fs-report.json \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /work/code/client

      - name: Run Trivy FS scan (TABLE)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.68.2 fs \
            --format table \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /work/code/client \
            > client-trivy-fs-report.txt

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-json-report
          path: client-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-table-report
          path: client-trivy-fs-report.txt
          if-no-files-found: warn

  lint:
    name: Lint - client
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - checkov-dockerfile
    defaults:
      run:
        working-directory: code/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: code/client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            if grep -q 'no test specified' package.json; then
              echo "No tests configured yet. Skipping tests."
            else
              npm test
            fi
          else
            echo "No test script found. Skipping tests."
          fi

  sonarqube:
    name: SonarQube Analysis - client
    runs-on: ubuntu-latest
    needs: client-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: code/client
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        id: quality-gate
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: code/client/.scannerwork/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Display Quality Gate Status
        if: always()
        run: |
          echo "Service: client"
          echo "Quality Gate status: ${{ steps.quality-gate.outputs.quality-gate-status }}"

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    needs:
      - client-test
      - sonarqube
    defaults:
      run:
        working-directory: code/client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  docker:
    name: Client Docker Build, Scan, SBOM and Push
    runs-on: ubuntu-latest
    needs: client-build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build client Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./code/client
          file: ./code/client/Dockerfile
          load: true
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            sanketmahajan/micro-service-mernapp:client
            sanketmahajan/micro-service-mernapp:${{ github.sha }}

      - name: Verify Docker images
        run: |
          docker image inspect sanketmahajan/micro-service-mernapp:client
          docker image inspect sanketmahajan/micro-service-mernapp:${GITHUB_SHA}

      - name: Save client image for Trivy scanning
        run: |
          docker save \
            sanketmahajan/micro-service-mernapp:client \
            -o client-image.tar

      - name: Run Trivy image scan (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan" \
            aquasec/trivy:0.68.2 image \
            --input /scan/client-image.tar \
            --format json \
            --output /scan/client-image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy image scan (TABLE)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan" \
            aquasec/trivy:0.68.2 image \
            --input /scan/client-image.tar \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            > client-image-trivy-report.txt

      - name: Upload Trivy image JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-image-trivy-json-report
          path: client-image-trivy-report.json
          if-no-files-found: warn

      - name: Upload Trivy image table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-image-trivy-table-report
          path: client-image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate client source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./code/client
          format: spdx-json
          output-file: client-source-sbom.spdx.json
          upload-artifact: true

      - name: Generate client image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sanketmahajan/micro-service-mernapp:client
          format: spdx-json
          output-file: client-image-sbom.spdx.json
          upload-artifact: true

      - name: Upload SBOM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-sbom-reports
          path: |
            client-source-sbom.spdx.json
            client-image-sbom.spdx.json
          if-no-files-found: warn

      - name: Push client Docker images
        run: |
          docker push sanketmahajan/micro-service-mernapp:client
          docker push sanketmahajan/micro-service-mernapp:${GITHUB_SHA}

  update-main-manifest:
    name: Update Main Branch Frontend Manifest
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TOKEN_GITHUB_PAT }}

      - name: Update frontend image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          MANIFEST="k8-manifests/frontend.yaml"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          sed -i \
            "s|image: sanketmahajan/micro-service-mernapp:.*|image: sanketmahajan/micro-service-mernapp:${IMAGE_TAG}|" \
            "$MANIFEST"

          echo "Updated image:"
          grep "image:" "$MANIFEST"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8-manifests/frontend.yaml

          git commit -m "Update frontend image to ${GITHUB_SHA} [skip ci]" \
            || echo "No manifest changes to commit"

          git push origin main

  deploy-to-k8s:
    name: Deploy Frontend to Amazon EKS
    runs-on: ubuntu-latest
    needs: update-main-manifest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: todo-microservice-dev-eks
      K8S_NAMESPACE: todo-app
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TOKEN_GITHUB_PAT }}

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932542905800:role/todo-microservice-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify namespace and access
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"
          kubectl auth can-i get deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i patch deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i create services -n "${K8S_NAMESPACE}"

      - name: Apply frontend manifest
        run: |
          kubectl apply \
            -f k8-manifests/frontend.yaml \
            -n "${K8S_NAMESPACE}"

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s

      - name: Verify frontend resources
        if: success()
        run: |
          kubectl get deployment frontend -n "${K8S_NAMESPACE}"
          kubectl get pods -l app=frontend -n "${K8S_NAMESPACE}"
          kubectl get service frontend-service -n "${K8S_NAMESPACE}"
