apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: sanketmahajan/mern-micro-service-todo-app:auth-service
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
        env:
        - name: PORT
          value: "4001"
        - name: DB_HOST
          value: "mysql"
        - name: DB_USER
          value: "todo_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_PASSWORD
        - name: DB_NAME
          value: "todo_auth_db"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          value: "7d"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: todo-app
spec:
  selector:
    app: auth-service
  ports:
  - port: 4001
    targetPort: 4001