apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: sanketmahajan/mern-micro-service-todo-app:api-gateway
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:4001"
        - name: TODO_SERVICE_URL
          value: "http://todo-service:4002"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: todo-app
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 4000
    targetPort: 4000